<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
  <title>CrashDash</title>
  <!-- CrashDash brand mark: a yellow lightning bolt crossing a red down candle
       and a blue up candle. Rebuilt as vector from the approved brand board
       (crashdash-landing-pack/reference/logo-brand-direction.png). -->
  <defs>
    <linearGradient id="cdBolt" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="0.55" stop-color="#ffd21e"/>
      <stop offset="1" stop-color="#f2a900"/>
    </linearGradient>
    <linearGradient id="cdDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#d93a3a"/>
    </linearGradient>
    <linearGradient id="cdUp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa2ff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- market candles: restrained red down / blue up -->
  <g stroke-linecap="round">
    <line x1="14" y1="13" x2="14" y2="51" stroke="#d93a3a" stroke-width="3"/>
    <rect x="7.5" y="27" width="13" height="17" rx="2.5" fill="url(#cdDown)"/>
    <line x1="50" y1="13" x2="50" y2="51" stroke="#2563eb" stroke-width="3"/>
    <rect x="43.5" y="20" width="13" height="17" rx="2.5" fill="url(#cdUp)"/>
  </g>

  <!-- lightning bolt -->
  <path d="M37 3 L15 34 H28 L25 61 L47 29 H34 Z" fill="url(#cdBolt)"/>
</svg>
