  </g>

  <text x="212" y="152"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">CrashDash</text>

  <text x="96" y="300"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="66" font-weight="700" fill="#ffffff" letter-spacing="-1.6">Find what others</text>
  <text x="96" y="382"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="66" font-weight="700" fill="#ffd21e" letter-spacing="-1.6">have forgotten.</text>

  <rect x="96" y="440" width="620" height="3" fill="url(#ogRule)"/>

  <text x="96" y="512"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
