<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="CrashDash — find what others have forgotten">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#101d33"/>
    </linearGradient>
    <linearGradient id="ogMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a8dff"/>
      <stop offset="1" stop-color="#1b4fd0"/>
    </linearGradient>
    <linearGradient id="ogRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#2f7bff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <g transform="translate(96, 96)">
    <rect width="88" height="88" rx="21" fill="url(#ogMark)"/>
    <path d="M15 34 L32 60 L45 44 L70 21"
