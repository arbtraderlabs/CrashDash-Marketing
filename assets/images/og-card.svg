<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
  <title>CrashDash — find what others have forgotten</title>
  <!-- Social share card. NOTE: social platforms do not render SVG, so this file
       is NOT referenced from an og:image tag. Export it to a 1200x630 PNG
       (og-card.png) on a machine with a rasteriser, then reference that. -->
  <defs>
    <linearGradient id="ogField" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#101d33"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <radialGradient id="ogGlow" cx="0.18" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#2f7bff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2f7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ogBolt" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="0.55" stop-color="#ffd21e"/>
      <stop offset="1" stop-color="#f2a900"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogField)"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- faint market grid -->
  <g stroke="#2f7bff" stroke-opacity="0.10" stroke-width="1">
    <path d="M0 140H1200M0 260H1200M0 380H1200M0 500H1200"/>
    <path d="M160 0V630M360 0V630M560 0V630M760 0V630M960 0V630M1160 0V630"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(80 74) scale(1.35)">
    <g stroke-linecap="round">
      <line x1="14" y1="13" x2="14" y2="51" stroke="#d93a3a" stroke-width="3"/>
      <rect x="7.5" y="27" width="13" height="17" rx="2.5" fill="#d93a3a"/>
      <line x1="50" y1="13" x2="50" y2="51" stroke="#2563eb" stroke-width="3"/>
      <rect x="43.5" y="20" width="13" height="17" rx="2.5" fill="#2563eb"/>
    </g>
    <path d="M37 3 L15 34 H28 L25 61 L47 29 H34 Z" fill="url(#ogBolt)"/>
  </g>

  <text x="196" y="126" font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-1">CrashDash</text>
  <text x="80" y="205" font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="26" fill="#8ea1bd">When the market breaks, you don't.</text>

  <text x="80" y="352" font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="82" font-weight="700" fill="#ffffff" letter-spacing="-2">Find what others</text>
  <text x="80" y="442" font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="82" font-weight="700" fill="#ffd21e" letter-spacing="-2">have forgotten.</text>

  <text x="80" y="530" font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="27" fill="#c9d6e8">UK-listed stocks · research tool · LSE private beta</text>

  <text x="80" y="588" font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="22" fill="#8ea1bd">Research tool only · not investment advice</text>
</svg>
