<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="CrashDash — overlooked UK small-caps, brought back into view">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#122a3a"/>
    </linearGradient>
    <linearGradient id="ogMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12a196"/>
      <stop offset="1" stop-color="#0a5c56"/>
    </linearGradient>
    <linearGradient id="ogRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12a196"/>
      <stop offset="1" stop-color="#12a196" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <g transform="translate(96, 96)">
    <rect width="88" height="88" rx="21" fill="url(#ogMark)"/>
    <path d="M15 34 L32 60 L45 44 L70 21"
          fill="none" stroke="#ffffff" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="212" y="152"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">CrashDash</text>

  <text x="96" y="300"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="66" font-weight="700" fill="#ffffff" letter-spacing="-1.6">Overlooked companies.</text>
  <text x="96" y="382"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="66" font-weight="700" fill="#7fd8d0" letter-spacing="-1.6">A second look.</text>

  <rect x="96" y="440" width="620" height="3" fill="url(#ogRule)"/>

  <text x="96" y="512"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="30" fill="#a9b6c6">UK-listed smaller companies · research tool · private beta</text>
</svg>
